name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install approved worn card artwork or verified legacy deck
        run: |
          python3 tools/cards/import_cards.py
          test "$(find app/src/main/assets/cards -maxdepth 1 -name '*.jpg' | wc -l)" -eq 40
      - name: Import approved salon recordings if bundle supplied
        run: |
          python3 tools/audio/import_salon_audio.py
      - name: Verify the imported sound resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src = Path("tools/audio/CARTE-Salon-Audio.zip")
          if src.exists():
              with ZipFile(src) as audio:
                  for name in audio.namelist():
                      actual = Path("app/src/main/res/raw") / name
                      assert actual.is_file(), f"Missing imported sound: {name}"
                      assert actual.stat().st_size == audio.getinfo(name).file_size, f"Wrong size: {name}"
              print("All approved audio files are present before compilation.")
          else:
              print("Audio bundle not uploaded yet; this build has no sampled music/ambience.")
          PY
      - name: Fetch and process all approved real sound recordings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 tools/audio/import_approved_recordings.py
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify all 40 HD cards are actually inside the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 1_000_000, "Missing or empty APK"
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              expected = {f"assets/cards/{suit}_{n:02d}.jpg" for suit in ("coppe", "denari", "bastoni", "spade") for n in range(1, 11)}
              missing = expected - names
              assert not missing, f"APK missing HD cards: {sorted(missing)}"
              for name in expected:
                  info = archive.getinfo(name)
                  assert info.file_size > 10000, f"Invalid card asset: {name}"
                  with archive.open(name) as card:
                      assert card.read(3) == bytes((255, 216, 255)), f"Not JPEG: {name}"
          # If the approved vintage card archives are present, validate
          # byte-for-byte inclusion in the compiled APK (not just file names).
          from pathlib import Path
          for part in ("tools/cards/CARTE-usura-parte-1.zip",
                       "tools/cards/CARTE-usura-parte-2.zip"):
              path = Path(part)
              if not path.is_file():
                  continue
              with ZipFile(path) as originals:
                  for source_name in originals.namelist():
                      compiled_name = source_name.removeprefix("app/src/main/")
                      assert archive is not None
                      with ZipFile(apk) as built:
                          assert originals.read(source_name) == built.read(compiled_name), (
                              f"Approved artwork differs inside APK: {compiled_name}"
                          )
          print("Verified: APK contains forty HD JPEG cards and any approved vintage images unchanged.")
          PY
      - name: Verify recorded audio inside the APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          expected = ('salon_jazz', 'salon_fireplace', 'salon_card_deal',
                      'salon_card_play', 'salon_card_collect',
                      'salon_conversation', 'salon_glassware',
                      'salon_chair', 'salon_footsteps', 'salon_applause')
          with ZipFile(apk) as z:
              for name in expected:
                  matches = [entry for entry in z.namelist()
                             if entry.startswith('res/raw/') and entry.split('/')[-1].startswith(name + '.')]
                  assert len(matches) == 1, f'Audio missing from APK: {name}'
                  with z.open(matches[0]) as fp:
                      assert fp.read(4) == b'OggS', f'Invalid packaged sound: {name}'
                  print('Verified APK audio:', matches[0])
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CARTE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
