name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract supplied HD card archive or fetch original images
        run: |
          if [ -f app/src/main/assets/CARTE-HD-assets.zip ]; then
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("app/src/main/assets/CARTE-HD-assets.zip")
          with ZipFile(archive) as z:
              expected = {f"app/src/main/assets/cards/{suit}_{n:02d}.jpg" for suit in ("coppe", "denari", "bastoni", "spade") for n in range(1, 11)}
              names = {n for n in z.namelist() if not n.endswith("/")}
              assert names == expected, f"Archive card set mismatch: {sorted(expected - names)}"
              for name in expected:
                  data = z.read(name)
                  assert len(data) > 10000 and data[:3] == bytes((255, 216, 255)), f"Invalid card: {name}"
                  dest = Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
          PY
          else
            python3 tools/fetch_neapolitan_cards.py
          fi
          test "$(find app/src/main/assets/cards -maxdepth 1 -name '*.jpg' | wc -l)" -eq 40
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify all 40 HD cards are actually inside the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 1_000_000, "Missing or empty APK"
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              expected = {f"assets/cards/{suit}_{n:02d}.jpg" for suit in ("coppe", "denari", "bastoni", "spade") for n in range(1, 11)}
              missing = expected - names
              assert not missing, f"APK missing HD cards: {sorted(missing)}"
              for name in expected:
                  info = archive.getinfo(name)
                  assert info.file_size > 10000, f"Invalid card asset: {name}"
                  with archive.open(name) as card:
                      assert card.read(3) == bytes((255, 216, 255)), f"Not JPEG: {name}"
          print("Verified: installable APK contains all 40 JPEG card assets.")
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CARTE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
